<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEGANOV.SYS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
      :root{
          --g:#00ff41;--g2:#00c832;--glow:rgba(0,255,65,.5);
          --bg:#020d02;--brd:rgba(0,255,65,.18);
          --dim:#2e5e3a;--red:#ff2244;
      }
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%}
      body{
          background:var(--bg);
          font-family:'Share Tech Mono',monospace;
          overflow:hidden;
      }

      /* CANVAS */
      #mc{position:fixed;inset:0;z-index:0;opacity:.28;}

      /* OVERLAY */
      #ov{
          position:fixed;inset:0;z-index:1;pointer-events:none;
          background:
                  repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px),
                  radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.78) 100%);
      }


      /* BOOT */
      #boot{
          position:fixed;inset:0;z-index:100;background:var(--bg);
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
          transition:opacity .9s;
      }
      #boot.gone{opacity:0;pointer-events:none;}
      .bl{
          font-size:.72rem;color:var(--dim);letter-spacing:.09em;
          opacity:0;transform:translateX(-8px);
          transition:opacity .16s,transform .16s;
          width:440px;max-width:90vw;
      }
      .bl .bs{margin-right:6px;}
      .bl.ok .bs{color:var(--g);}
      .bl.err .bs{color:var(--red);}
      .bl.warn .bs{color:#f0a500;}
      #bbw{margin-top:24px;width:280px;}
      #bbl{font-size:.6rem;color:var(--dim);letter-spacing:.24em;margin-bottom:7px;text-align:center;}
      #bb{height:1px;background:rgba(0,255,65,.12);}
      #bbf{height:100%;width:0;background:var(--g);box-shadow:0 0 10px var(--g);transition:width .05s;}

      /* MAIN */
      #main{
          position:fixed;inset:0;z-index:2;
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:0;
          opacity:0;transform:translateY(10px);
          transition:opacity 1s,transform 1s;
      }
      #main.vis{opacity:1;transform:none;}

      /* TOP BAR */
      .topbar{
          position:fixed;top:0;left:0;right:0;
          padding:18px 32px;
          display:flex;justify-content:space-between;align-items:center;
          border-bottom:1px solid rgba(0,255,65,.07);
          z-index:3;
      }
      .topbar-l{font-size:.62rem;color:var(--dim);letter-spacing:.22em;}
      .topbar-r{font-size:.62rem;color:var(--dim);letter-spacing:.15em;}
      .topbar-r span{color:var(--g);}

      /* HERO */
      .hero{text-align:center;margin-bottom:64px;}

      .eyebrow{
          font-size:.65rem;letter-spacing:.4em;color:var(--dim);
          margin-bottom:22px;
          opacity:0;animation:fu .5s .05s forwards;
      }

      .name{
          font-family:'Orbitron',sans-serif;
          font-size:clamp(3rem,8vw,6.5rem);
          font-weight:900;color:var(--g);
          letter-spacing:.06em;line-height:1;
          text-shadow:0 0 40px var(--glow),0 0 100px rgba(0,255,65,.12);
          opacity:0;animation:fu .7s .15s forwards;
          position:relative;
      }

      /* subtle flicker */
      .name::after{
          content:'MIKHAIL NEGANOV';
          position:absolute;inset:0;
          color:var(--g);opacity:0;
          animation:flicker 8s 3s infinite;
      }
      @keyframes flicker{
          0%,97%,100%{opacity:0;transform:none}
          97.5%{opacity:.6;transform:translate(2px,0) skewX(1deg)}
          98%{opacity:0}
          98.5%{opacity:.4;transform:translate(-2px,0)}
          99%{opacity:0}
      }

      .role{
          margin-top:14px;font-size:.82rem;color:var(--dim);
          letter-spacing:.18em;
          opacity:0;animation:fu .5s .3s forwards;
      }

      .divider{
          width:0;height:1px;
          background:linear-gradient(90deg,transparent,var(--g),transparent);
          margin:40px auto;
          animation:expandW .9s .5s forwards;
      }
      @keyframes expandW{to{width:260px;}}

      /* BUTTONS */
      .btns{
          display:flex;flex-direction:column;gap:16px;align-items:center;
          opacity:0;animation:fu .6s .6s forwards;
      }

      .btn{
          position:relative;
          width:320px;height:58px;
          background:transparent;
          border:1px solid var(--brd);
          border-radius:3px;
          font-family:'Share Tech Mono',monospace;
          font-size:.82rem;letter-spacing:.28em;color:#8ec9a0;
          text-transform:uppercase;
          cursor:pointer;
          text-decoration:none;display:flex;align-items:center;justify-content:center;
          overflow:hidden;
          transition:color .3s,border-color .3s,box-shadow .3s;
          -webkit-tap-highlight-color:transparent;
      }

      /* scan line sweep */
      .btn::before{
          content:'';position:absolute;top:0;left:-100%;
          width:100%;height:100%;
          background:linear-gradient(90deg,transparent,rgba(0,255,65,.07),transparent);
          transition:left .45s;
      }
      .btn:hover::before{left:100%;}

      /* left accent bar */
      .btn::after{
          content:'';position:absolute;left:0;top:50%;
          width:2px;height:0;
          background:var(--g);box-shadow:0 0 10px var(--g);
          transform:translateY(-50%);
          transition:height .3s;
      }
      .btn:hover::after{height:70%;}

      .btn:hover{
          border-color:rgba(0,255,65,.5);color:var(--g);
          box-shadow:0 0 24px rgba(0,255,65,.1),inset 0 0 20px rgba(0,255,65,.04);
      }

      .btn-icon{margin-right:14px;font-size:.75rem;opacity:.6;}

      /* PRIMARY button (resume) */
      .btn-primary{
          border-color:rgba(0,255,65,.35);
          background:rgba(0,255,65,.04);
          color:var(--g2);
      }

      /* number label */
      .btn-num{
          position:absolute;right:18px;
          font-size:.58rem;color:var(--dim);letter-spacing:.1em;
      }

      /* FOOTER */
      .foot{
          position:fixed;bottom:0;left:0;right:0;
          padding:16px 32px;
          display:flex;justify-content:center;gap:32px;
          border-top:1px solid rgba(0,255,65,.07);
          z-index:3;
      }
      .foot a{
          font-size:.6rem;color:var(--dim);letter-spacing:.18em;
          text-decoration:none;transition:color .2s;
      }
      .foot a:hover{color:var(--g);}

      @keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

      ::-webkit-scrollbar{width:4px;}
      ::-webkit-scrollbar-track{background:var(--bg);}
      ::-webkit-scrollbar-thumb{background:var(--dim);}
  </style>
</head>
<body>

<canvas id="mc"></canvas>
<div id="ov"></div>
<!-- BOOT -->
<div id="boot">
  <div id="blines"></div>
  <div id="bbw">
    <div id="bbl">NEGANOV.SYS</div>
    <div id="bb"><div id="bbf"></div></div>
  </div>
</div>

<!-- MAIN -->
<div id="main">

  <div class="topbar">
    <span class="topbar-l">NEGANOV.SYS &nbsp;//&nbsp; v2.0</span>
    <span class="topbar-r">STATUS &nbsp;<span>● ONLINE</span></span>
  </div>

  <div class="hero">
    <p class="eyebrow">// INITIALIZING PORTFOLIO</p>
    <h1 class="name">MIKHAIL<br>NEGANOV</h1>
    <p class="role">.NET DEVELOPER &nbsp;·&nbsp; ITMO UNIVERSITY &nbsp;·&nbsp; SPB</p>
  </div>

  <div class="divider"></div>

  <nav class="btns">
    <a class="btn btn-primary" href="https://drive.google.com/uc?export=download&id=15X2nk0A-5k9maR4XEozy1N-Nb_CBJoem" target="_blank">
      <span class="btn-icon">↓</span>
      RESUME.PDF
      <span class="btn-num">01</span>
    </a>
    <a class="btn" href="about.html">
      <span class="btn-icon">›</span>
      ABOUT_ME
      <span class="btn-num">02</span>
    </a>
    <a class="btn" href="portfolio.html">
      <span class="btn-icon">›</span>
      PROJECTS
      <span class="btn-num">03</span>
    </a>
  </nav>

  <footer class="foot">
    <a href="mailto:mitrasher.negativ@gmail.com">MAIL</a>
    <a href="https://github.com/666mxvbee" target="_blank" rel="noopener">GITHUB</a>
    <a href="https://t.me/maybe420" target="_blank" rel="noopener">TELEGRAM</a>
  </footer>

</div>

<script>
    /* MATRIX RAIN */
    (()=>{
        const cv=document.getElementById('mc'),cx=cv.getContext('2d');
        const ch='アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>{}[]|\\@#$%'.split('');
        const fs=14;let cols,drops,speeds;
        function resize(){
            cv.width=innerWidth;cv.height=innerHeight;
            cols=Math.floor(cv.width/fs);
            drops=Array.from({length:cols},()=>Math.random()*-80);
            speeds=Array.from({length:cols},()=>0.25+Math.random()*.7);
        }
        function draw(){
            cx.fillStyle='rgba(2,13,2,0.05)';cx.fillRect(0,0,cv.width,cv.height);
            for(let i=0;i<cols;i++){
                const c=ch[Math.floor(Math.random()*ch.length)];
                const b=Math.random();
                if(b>.96){cx.fillStyle='#fff';cx.shadowColor='#00ff41';cx.shadowBlur=10;}
                else if(b>.75){cx.fillStyle='#00ff41';cx.shadowColor='#00ff41';cx.shadowBlur=4;}
                else{cx.fillStyle='#003d14';cx.shadowBlur=0;}
                cx.font=fs+'px Share Tech Mono';
                cx.fillText(c,i*fs,drops[i]*fs);
                if(drops[i]*fs>cv.height&&Math.random()>.975)drops[i]=0;
                drops[i]+=speeds[i];
            }
        }
        resize();window.addEventListener('resize',resize);
        setInterval(draw,42);
    })();

    /* BOOT */
    (async()=>{
        const lines=[
            {s:'[  OK  ]',t:'Kernel loaded: NEGANOV.SYS 2.0',ok:'ok'},
            {s:'[  OK  ]',t:'Mounting identity partition…',ok:'ok'},
            {s:'[  OK  ]',t:'.NET runtime: linked',ok:'ok'},
            {s:'[ WARN ]',t:'Social life module: not found',ok:'warn'},
            {s:'[  OK  ]',t:'3 modules detected: RESUME / ABOUT / PROJECTS',ok:'ok'},
            {s:'[  OK  ]',t:'Ready.',ok:'ok'},
        ];
        const wrap=document.getElementById('blines'),fill=document.getElementById('bbf');
        const delay=ms=>new Promise(r=>setTimeout(r,ms));
        for(let i=0;i<lines.length;i++){
            const l=lines[i],el=document.createElement('div');
            el.className=`bl ${l.ok}`;
            el.innerHTML=`<span class="bs">${l.s}</span>${l.t}`;
            wrap.appendChild(el);
            requestAnimationFrame(()=>{el.style.opacity='1';el.style.transform='none';});
            fill.style.width=((i+1)/lines.length*100)+'%';
            await delay(l.ok==='warn'?200:110);
        }
        await delay(420);
        document.getElementById('boot').classList.add('gone');
        setTimeout(()=>{
            document.getElementById('boot').style.display='none';
            document.getElementById('main').classList.add('vis');
        },950);
    })();


</script>
</body>
</html>
